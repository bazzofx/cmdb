    <script>
      (function () {
        try {
          var allowed = ['default', 'onyx', 'x3000', 'midnight', 'morning', 'coffee', 'cyber'];
          var stored = window.localStorage.getItem('csm-theme') || 'cyber';
          if (stored === 'steel') stored = 'onyx';
          document.documentElement.setAttribute(
            'data-theme',
            allowed.indexOf(stored) === -1 ? 'cyber' : stored
          );
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'cyber');
        }
      })();
    </script>
    <meta name="description" content="Centralised visibility of server infrastructure, ownership, business units, technical relationships, incident triage, and operational responsibilities for Security and Infrastructure teams." />
